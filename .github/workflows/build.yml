name: Build VST3 Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Позволяет запускать сборку вручную

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Clone JUCE
      run: git clone --depth 1 --branch 7.0.12 https://github.com/juce-framework/JUCE.git ../JUCE

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: cmake -B build -A x64

    - name: Configure CMake (macOS)
      if: runner.os == 'macOS'
      run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

    - name: Build
      run: cmake --build build --config Release

    - name: Prepare Artifact (Windows)
      if: runner.os == 'Windows'
      run: |
        mkdir artifact
        Compress-Archive -Path "build/PolySynth_artefacts/Release/VST3/PolySynth.vst3" -DestinationPath "artifact/PolySynth-Windows-VST3.zip"

    - name: Prepare Artifact (macOS)
      if: runner.os == 'macOS'
      run: |
        mkdir artifact
        cd build/PolySynth_artefacts/Release
        zip -r $GITHUB_WORKSPACE/artifact/Fsynth-macOS-VST3.zip VST3/PolySynth.vst3

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PolySynth-${{ runner.os }}-VST3
        path: artifact/
